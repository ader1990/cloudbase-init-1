name: Cloudbase-Init unit tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10","3.12"]
        architecture: ["x64"]

    steps:
    - name: Checkout cloudbase-init repository
      uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Install python3 tox
      shell: bash
      run: |
        python3 -m pip install -r requirements.txt -r test-requirements.txt
    - name: Run Cloudbase-Init unit tests with tox
      shell: bash
      run: |
        stestr run --exclude-list faling.tests --random
